name: Heartshop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, sqlite3, mbstring
          coverage: none
      - name: Apache fixture runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2
      - name: Offline regression suite
        run: bash scripts/heartshop/check.sh
