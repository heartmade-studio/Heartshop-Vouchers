name: Heartshop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.5'
          extensions: curl, sqlite3, mbstring
          coverage: none
      - name: Apache fixture runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y apache2
      - name: Offline regression suite
        run: bash scripts/heartshop/check.sh
