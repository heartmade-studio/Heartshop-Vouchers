<!doctype html>
<html lang="pl" data-offer="masaz-60">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Twój voucher — Voucher na masaż</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="assets/shop.css?v=10">
<link rel="stylesheet" href="assets/voucher-landing.css?v=1">
<link rel="stylesheet" href="assets/voucher-flow.css?v=6">
<link rel="stylesheet" href="assets/voucher-print.css?v=6">
</head>
<body class="voucher-landing voucher-flow voucher-page">
<header class="voucher-header site-header no-print">
  <div class="wrap"><a class="brand" href="./">Voucher na masaż</a><div class="header-end"><button type="button" class="btn btn-sm" id="download" hidden>Pobierz PDF</button><button type="button" class="btn btn-sm" id="print" hidden>Drukuj</button></div></div>
</header>
<main class="wrap narrow print-sheet">
  <p class="no-print" id="download-error" role="alert" hidden>Nie udało się pobrać PDF. Spróbuj ponownie lub wybierz „Drukuj”.</p>
  <div class="vouchers" id="vouchers" aria-live="polite"><p class="muted">Wczytuję voucher…</p></div>
  <div class="thanks-wait" id="wait" hidden>
    <h1 id="wait-title"></h1>
    <p class="lead muted" id="wait-text"></p>
  </div>
</main>
<div id="print-pages" aria-hidden="true"></div>
<template id="voucher-template">
  <article class="gift-pair">
    <section class="gift-face gift-front" aria-label="Pierwsza strona">
      <p class="voucher-demo" hidden>DEMO — voucher przykładowy, nie uprawnia do usługi</p>
      <h1>Voucher</h1>
      <p class="gift-for"></p>
      <p class="gift-message"></p>
    </section>
    <section class="gift-face gift-back" aria-label="Druga strona">
      <div class="service-cover">
        <h2></h2>
        <img src="assets/voucher-massage.webp" alt="" width="1000" height="1500">
      </div>
      <div class="booking-details">
        <dl>
          <div><dt>E-mail kupującego:</dt> <dd class="booking-email"></dd></div>
          <div><dt>Telefon kontaktowy:</dt> <dd>+48 600 000 000</dd></div>
          <div><dt>Adres:</dt> <dd>ul. Masażowa 12, 00-567 Warszawa</dd></div>
          <div><dt>Ważny do:</dt> <dd class="booking-expiry"></dd></div>
        </dl>
        <p class="booking-note">Zapraszam do kontaktu telefonicznego, żeby umówić dogodny termin. Więcej informacji na stronie piekne-masaze.pl</p>
        <small class="voucher-number">Nr vouchera: <span class="booking-code"></span></small>
        <small class="gift-status"></small>
      </div>
    </section>
  </article>
</template>
<script src="assets/i18n.js?v=8"></script>
<script src="assets/voucher.js?v=25"></script>
</body>
</html>
